<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>נטרול מטען חבלה</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #ff2222;
    --green: #00ff88;
    --amber: #ffcc00;
    --bg: #0a0a0a;
    --panel: #111118;
    --panel2: #1a1a2e;
    --text: #e0e0e0;
    --dim: #666;
  }

  html { height: 100%; overflow: hidden; position: fixed; width: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100%;
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    padding: 20px 16px 32px;
    min-height: 100vh;
    min-height: 100dvh;
    animation: fadeIn 0.35s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.15rem, 5.5vw, 2rem);
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 0.68rem;
    color: var(--dim);
    letter-spacing: 0.18em;
    text-align: center;
    margin-bottom: 22px;
  }

  /* ── SETUP ── */
  #setup { justify-content: center; }
  #setup h1 { color: var(--amber); text-shadow: 0 0 18px rgba(255,204,0,0.5); }

  .section-label {
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
    width: 100%;
    text-align: center;
  }

  .time-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    flex-direction: row-reverse;
    align-items: center;
    width: 100%;
  }
  .time-btn {
    flex: 1;
    padding: 12px 4px;
    background: var(--panel);
    border: 2px solid #333;
    color: var(--dim);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.8rem, 3vw, 1.05rem);
    cursor: pointer;
    border-radius: 6px;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  .time-btn:active { opacity: 0.7; }
  .time-btn.selected {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(255,204,0,0.08);
    box-shadow: 0 0 14px rgba(255,204,0,0.25);
  }
  .time-btn span {
    display: block;
    font-size: 0.48rem;
    letter-spacing: 0.12em;
    color: inherit;
    margin-top: 3px;
    font-family: 'Share Tech Mono', monospace;
  }
  .test-btn {
    flex: 0 0 auto;
    padding: 8px 10px;
    font-size: clamp(0.58rem, 2.5vw, 0.68rem);
    min-height: 44px;
    border-color: #2a2a2a;
    color: #555;
  }
  .test-btn span { font-size: 0.44rem; }
  .test-btn.selected {
    border-color: var(--red);
    color: var(--red);
    background: rgba(255,34,34,0.08);
    box-shadow: 0 0 14px rgba(255,34,34,0.25);
  }

  /* 4-digit code inputs */
  .code-inputs {
    display: flex;
    gap: 8px;
    margin-bottom: 26px;
    flex-direction: row-reverse;
    width: 100%;
    justify-content: center;
  }
  .code-inputs input {
    flex: 1;
    max-width: 68px;
    min-width: 0;
    height: 70px;
    background: var(--panel2);
    border: 2px solid #333;
    border-radius: 6px;
    color: var(--amber);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px, 6vw, 2.2rem);
    text-align: center;
    outline: none;
    caret-color: var(--amber);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .code-inputs input:focus { border-color: var(--amber); box-shadow: 0 0 10px rgba(255,204,0,0.3); }

  .arm-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #7a0000, #cc0000);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.82rem, 3.5vw, 1rem);
    letter-spacing: 0.16em;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.2s;
    box-shadow: 0 0 22px rgba(200,0,0,0.4);
    touch-action: manipulation;
    min-height: 54px;
    -webkit-appearance: none;
    appearance: none;
  }
  .arm-btn:active { opacity: 0.8; }

  .error-msg {
    margin-top: 10px;
    font-size: 0.7rem;
    color: var(--red);
    letter-spacing: 0.08em;
    min-height: 18px;
    text-align: center;
  }

  /* ── GAME ── */
  #game { justify-content: flex-start; padding-top: 14px; }
  #game h1 { color: var(--red); text-shadow: 0 0 20px rgba(255,34,34,0.6); }

  /* attempts dots */
  .attempt-dots {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-direction: row-reverse;
    justify-content: center;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid #444;
    background: transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .dot.used { background: var(--red); border-color: var(--red); box-shadow: 0 0 6px rgba(255,34,34,0.7); }

  .bomb-wrapper {
    position: relative;
    width: min(310px, 90vw);
    aspect-ratio: 340 / 240;
    margin: 0 auto 14px;
  }
  .bomb-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.8)) drop-shadow(0 0 10px rgba(255,34,34,0.2));
  }

  .timer-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -56%);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .timer-display {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.9rem, 8.5vw, 3rem);
    font-weight: 900;
    color: #ff3300;
    text-shadow: 0 0 14px rgba(255,50,0,0.95), 0 0 3px rgba(255,200,100,0.6);
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .timer-display.warning { color: var(--amber); text-shadow: 0 0 16px rgba(255,204,0,0.9); }
  .timer-display.critical { color: #ff1100; animation: blink 0.5s step-start infinite; }
  @keyframes blink { 50% { opacity: 0.12; } }

  .led {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px 2px rgba(255,34,34,0.8);
    animation: ledBlink 1s step-start infinite;
    margin-top: 4px;
  }
  @keyframes ledBlink { 50% { opacity: 0.08; box-shadow: none; } }
  .led.safe { background: var(--green); box-shadow: 0 0 6px 2px rgba(0,255,136,0.8); animation: none; }

  .defusal-panel {
    background: var(--panel);
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 16px 14px;
    width: 100%;
  }
  .panel-label {
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-align: center;
    margin-bottom: 12px;
  }

  /* 4-digit enter inputs */
  .enter-inputs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
    flex-direction: row-reverse;
    width: 100%;
  }
  .enter-inputs input {
    flex: 1;
    max-width: 64px;
    min-width: 0;
    height: 62px;
    background: #0d0d1a;
    border: 2px solid #2a2a4a;
    border-radius: 6px;
    color: var(--green);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px, 6vw, 1.9rem);
    text-align: center;
    outline: none;
    caret-color: var(--green);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .enter-inputs input:focus { border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,136,0.3); }

  .defuse-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--green);
    border-radius: 6px;
    color: var(--green);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.72rem, 3vw, 0.9rem);
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: background 0.2s;
    touch-action: manipulation;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  .defuse-btn:active { background: rgba(0,255,136,0.12); }

  .feedback {
    min-height: 20px;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    margin-top: 8px;
    color: var(--red);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .shake { animation: shake 0.38s ease; }

  /* ── WIN ── */
  #win { justify-content: center; background: radial-gradient(ellipse at center, #001a0e 0%, var(--bg) 70%); }
  #win h1 { color: var(--green); text-shadow: 0 0 28px rgba(0,255,136,0.7); }
  .win-icon { margin: 18px 0; }
  .win-time { font-size: 0.82rem; color: var(--dim); letter-spacing: 0.14em; margin-bottom: 26px; text-align: center; }
  .win-time span { color: var(--green); }

  /* ── LOSE ── */
  #lose { justify-content: center; background: radial-gradient(ellipse at center, #1a0000 0%, var(--bg) 70%); }
  #lose h1 { color: var(--red); text-shadow: 0 0 38px rgba(255,0,0,0.9); font-size: clamp(1.6rem, 6vw, 2.5rem); }
  .lose-sub { color: var(--dim); font-size: 0.68rem; letter-spacing: 0.18em; margin: 10px 0 26px; text-align: center; }

  .result-btn {
    padding: 14px 34px;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.72rem, 3vw, 0.82rem);
    letter-spacing: 0.18em;
    cursor: pointer;
    border: 2px solid;
    touch-action: manipulation;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.2s;
  }
  #win .result-btn { border-color: var(--green); color: var(--green); background: transparent; }
  #win .result-btn:active { background: rgba(0,255,136,0.12); }
  #lose .result-btn { border-color: var(--red); color: var(--red); background: transparent; }
  #lose .result-btn:active { background: rgba(255,34,34,0.1); }

  /* ── EFFECTS ── */
  .particles { position: fixed; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden; z-index:100; }
  .particle { position: absolute; border-radius: 50%; animation: particleFly 1.8s ease-out forwards; }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  .flash-overlay { position:fixed; top:0;right:0;bottom:0;left:0; background:#ff4400; animation:flashFade 0.8s ease-out forwards; pointer-events:none; z-index:200; }
  @keyframes flashFade { 0%{opacity:1} 100%{opacity:0} }
  .explosion-ring { position:fixed; top:0;right:0;bottom:0;left:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:50; }
  .ring { position:absolute; border-radius:50%; border:4px solid; animation:expandRing 1.2s ease-out forwards; }
  @keyframes expandRing { 0%{width:20px;height:20px;opacity:1} 100%{width:700px;height:700px;opacity:0} }
</style>
</head>
<body>

<!-- ═══ SETUP ═══ -->
<div id="setup" class="screen active">
  <h1>יחידת נטרול מטענים</h1>
  <p class="subtitle">הכן את המשימה לפני ההפעלה</p>

  <p class="section-label">▸ בחר זמן לנטרול</p>
  <div class="time-btns">
    <button class="time-btn" data-min="120" onclick="selectTime(this)">120<span>דקות</span></button>
    <button class="time-btn" data-min="90"  onclick="selectTime(this)">90<span>דקות</span></button>
    <button class="time-btn" data-min="60"  onclick="selectTime(this)">60<span>דקות</span></button>
    <button class="time-btn test-btn" data-seconds="10" onclick="selectTime(this)">TEST<span>10 שניות</span></button>
  </div>

  <p class="section-label">▸ הגדר קוד נטרול סודי (4 ספרות)</p>
  <div class="code-inputs" id="secretInputs">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 4" id="s3" oninput="moveSetupFocus(this,3)" onkeydown="setupBack(event,this,3)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 3" id="s2" oninput="moveSetupFocus(this,2)" onkeydown="setupBack(event,this,2)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 2" id="s1" oninput="moveSetupFocus(this,1)" onkeydown="setupBack(event,this,1)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 1" id="s0" oninput="moveSetupFocus(this,0)" onkeydown="setupBack(event,this,0)">
  </div>

  <button class="arm-btn" onclick="armDevice()">הפעל מטען</button>
  <p class="error-msg" id="setupError"></p>
</div>

<!-- ═══ GAME ═══ -->
<div id="game" class="screen">
  <h1>מטען פעיל</h1>
  <p class="subtitle">נטרל לפני שהזמן יגמר</p>

  <!-- attempt dots -->
  <div class="attempt-dots">
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot0"></div>
  </div>

  <!-- Realistic bomb SVG -->
  <div class="bomb-wrapper">
    <svg class="bomb-svg" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- metal body gradient -->
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#2e2e2e"/>
          <stop offset="30%" stop-color="#1c1c1c"/>
          <stop offset="70%" stop-color="#141414"/>
          <stop offset="100%" stop-color="#0e0e0e"/>
        </linearGradient>
        <!-- edge highlight -->
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#3a3a3a"/>
          <stop offset="15%" stop-color="#1a1a1a"/>
          <stop offset="85%" stop-color="#1a1a1a"/>
          <stop offset="100%" stop-color="#3a3a3a"/>
        </linearGradient>
        <!-- LCD glow -->
        <radialGradient id="lcdGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#0a0a00" stop-opacity="1"/>
          <stop offset="100%" stop-color="#020202" stop-opacity="1"/>
        </radialGradient>
        <!-- handle gradient -->
        <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#333"/>
          <stop offset="50%" stop-color="#1a1a1a"/>
          <stop offset="100%" stop-color="#111"/>
        </linearGradient>
        <!-- screw gradient -->
        <radialGradient id="screwGrad" cx="40%" cy="30%" r="60%">
          <stop offset="0%"  stop-color="#555"/>
          <stop offset="100%" stop-color="#222"/>
        </radialGradient>
        <!-- green wire -->
        <linearGradient id="wireGreen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#005522"/>
          <stop offset="50%" stop-color="#00aa44"/>
          <stop offset="100%" stop-color="#005522"/>
        </linearGradient>
      </defs>

      <!-- === HANDLE === -->
      <rect x="130" y="30" width="80" height="22" rx="10" fill="url(#handleGrad)" stroke="#404040" stroke-width="1.5"/>
      <rect x="138" y="35" width="64" height="12" rx="5" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
      <!-- grip ridges -->
      <line x1="152" y1="35" x2="152" y2="47" stroke="#222" stroke-width="2"/>
      <line x1="160" y1="35" x2="160" y2="47" stroke="#222" stroke-width="2"/>
      <line x1="168" y1="35" x2="168" y2="47" stroke="#222" stroke-width="2"/>
      <line x1="176" y1="35" x2="176" y2="47" stroke="#222" stroke-width="2"/>
      <line x1="184" y1="35" x2="184" y2="47" stroke="#222" stroke-width="2"/>

      <!-- === MAIN BODY === -->
      <rect x="22" y="52" width="296" height="160" rx="14" fill="url(#bodyGrad)" stroke="#404040" stroke-width="2"/>
      <!-- top/bottom edge highlight strips -->
      <rect x="22" y="52" width="296" height="8"  rx="6" fill="url(#edgeGrad)" opacity="0.6"/>
      <rect x="22" y="204" width="296" height="8" rx="6" fill="url(#edgeGrad)" opacity="0.4"/>
      <!-- side panel line -->
      <line x1="80"  y1="52" x2="80"  y2="212" stroke="#333" stroke-width="1"/>
      <line x1="260" y1="52" x2="260" y2="212" stroke="#333" stroke-width="1"/>

      <!-- === CORNER SCREWS === -->
      <circle cx="40"  cy="68"  r="7" fill="url(#screwGrad)" stroke="#555" stroke-width="1.2"/>
      <circle cx="300" cy="68"  r="7" fill="url(#screwGrad)" stroke="#555" stroke-width="1.2"/>
      <circle cx="40"  cy="196" r="7" fill="url(#screwGrad)" stroke="#555" stroke-width="1.2"/>
      <circle cx="300" cy="196" r="7" fill="url(#screwGrad)" stroke="#555" stroke-width="1.2"/>
      <!-- screw slots -->
      <line x1="37" y1="68" x2="43" y2="68" stroke="#111" stroke-width="1.5"/>
      <line x1="297" y1="68" x2="303" y2="68" stroke="#111" stroke-width="1.5"/>
      <line x1="37" y1="196" x2="43" y2="196" stroke="#111" stroke-width="1.5"/>
      <line x1="297" y1="196" x2="303" y2="196" stroke="#111" stroke-width="1.5"/>

      <!-- === LCD DISPLAY === -->
      <rect x="86" y="72" width="168" height="90" rx="5" fill="#080808" stroke="#222" stroke-width="2"/>
      <!-- LCD bezel inner -->
      <rect x="90" y="76" width="160" height="82" rx="3" fill="url(#lcdGlow)"/>
      <!-- LCD scan lines -->
      <line x1="90" y1="84"  x2="250" y2="84"  stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="92"  x2="250" y2="92"  stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="100" x2="250" y2="100" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="108" x2="250" y2="108" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="116" x2="250" y2="116" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="124" x2="250" y2="124" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="132" x2="250" y2="132" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="140" x2="250" y2="140" stroke="#0d0d08" stroke-width="1.5"/>
      <line x1="90" y1="148" x2="250" y2="148" stroke="#0d0d08" stroke-width="1.5"/>
      <!-- LCD label -->
      <text x="170" y="170" text-anchor="middle" font-family="monospace" font-size="6" fill="#2a2a18" letter-spacing="2">DETONATOR MK-IV</text>

      <!-- === LED INDICATOR (top center) === -->
      <circle id="svgLed" cx="170" cy="63" r="5.5" fill="#ff2222">
        <animate attributeName="opacity" values="1;0.1;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- LED ring -->
      <circle cx="170" cy="63" r="7.5" fill="none" stroke="#2a0000" stroke-width="1.5"/>

      <!-- === LEFT SIDE PANEL === -->
      <!-- circuit board texture -->
      <rect x="26" y="56" width="50" height="152" rx="2" fill="#0d0d12" opacity="0.6"/>
      <!-- circuit traces -->
      <line x1="36" y1="75" x2="70" y2="75" stroke="#0a2a0a" stroke-width="1.5"/>
      <line x1="36" y1="85" x2="55" y2="85" stroke="#1a1a00" stroke-width="1.5"/>
      <line x1="55" y1="85" x2="55" y2="95" stroke="#1a1a00" stroke-width="1.5"/>
      <line x1="36" y1="95" x2="70" y2="95" stroke="#0a2a0a" stroke-width="1.5"/>
      <!-- component box -->
      <rect x="30" y="102" width="46" height="28" rx="3" fill="#0a0a16" stroke="#1a1a2e" stroke-width="1.2"/>
      <rect x="34" y="106" width="38" height="20" rx="2" fill="#060610"/>
      <!-- IC chip pins -->

  <!-- Defusal panel -->
  <div class="defusal-panel">

      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 4" id="e3" oninput="moveEnterFocus(this,3)" onkeydown="enterBack(event,this,3)">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 3" id="e2" oninput="moveEnterFocus(this,2)" onkeydown="enterBack(event,this,2)">

<!-- ═══ WIN ═══ -->
<div id="win" class="screen">
  <h1>המטען נוטרל!</h1>
  <div class="win-icon">
    <svg width="86" height="86" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#00ff88" stroke-width="3"/>
      <polyline points="28,52 44,68 72,36" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="win-time" id="winTime">זמן שנותר: <span>--:--</span></p>
  <button class="result-btn" onclick="resetGame()">משימה חדשה</button>
</div>

<!-- ═══ LOSE ═══ -->
<div id="lose" class="screen">
  <h1>פיצוץ!</h1>
  <p class="lose-sub" id="loseSub">המטען התפוצץ — המשימה נכשלה</p>
  <svg width="96" height="96" viewBox="0 0 110 110" style="margin-bottom:22px">
    <circle cx="55" cy="55" r="30" fill="#3a0000"/>
    <circle cx="55" cy="55" r="20" fill="#660000"/>
    <circle cx="55" cy="55" r="10" fill="#cc2200"/>
    <line x1="55" y1="55" x2="55" y2="8"   stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="55" y2="102"  stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="8"  y2="55"   stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="102" y2="55"  stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="22" y2="22"   stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="22"   stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="22" y2="88"   stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="88"   stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <button class="result-btn" onclick="resetGame()">נסה שוב</button>
</div>

<div class="particles" id="particles"></div>

<script>
  /* ── State ── */
  let secretCode = '';
  let totalSeconds = 0;
  let remainingSeconds = 0;
  let timerInterval = null;
  let wrongAttempts = 0;
  const MAX_ATTEMPTS = 3;
  const setupIds = ['s0','s1','s2','s3'];   // 4 digits
  const enterIds = ['e0','e1','e2','e3'];   // 4 digits

  /* ── Audio (Web Audio API ticking) ── */
  let audioCtx = null;
  let tickInterval = null;

  function resumeAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tick(freq, gain) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function startTicking() {
    stopTicking();
    const fast = remainingSeconds <= 10;
    tick(900, 0.06);
    tickInterval = setInterval(() => {
      const isFast = remainingSeconds <= 10;
      tick(isFast ? 1100 : 900, isFast ? 0.1 : 0.06);
    }, remainingSeconds <= 10 ? 500 : 1000);
  }

  function stopTicking() {
    clearInterval(tickInterval);
    tickInterval = null;
  }

  /* ── Input helpers ── */
  function moveSetupFocus(el, idx) {
    el.value = el.value.replace(/[^0-9]/g, '').slice(-1);
    if (el.value && idx < 3) document.getElementById(setupIds[idx + 1]).focus();
  }
  function setupBack(e, el, idx) {
    if (e.key === 'Backspace' && !el.value && idx > 0) {
      e.preventDefault();
      document.getElementById(setupIds[idx - 1]).focus();
    }
  }
  function moveEnterFocus(el, idx) {
    el.value = el.value.replace(/[^0-9]/g, '').slice(-1);
    if (el.value && idx < 3) document.getElementById(enterIds[idx + 1]).focus();
  }
  function enterBack(e, el, idx) {
    if (e.key === 'Backspace' && !el.value && idx > 0) {
      e.preventDefault();
      document.getElementById(enterIds[idx - 1]).focus();
    }
  }

  /* ── Time selector ── */
  function selectTime(btn) {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    totalSeconds = btn.dataset.seconds
      ? parseInt(btn.dataset.seconds, 10)
      : parseInt(btn.dataset.min, 10) * 60;
  }

  /* ── Arm ── */
  function armDevice() {
    document.getElementById('setupError').textContent = '';
    if (!totalSeconds) {
      document.getElementById('setupError').textContent = '! יש לבחור זמן נטרול';
      return;
    }
    const digits = setupIds.map(id => document.getElementById(id).value);
    if (digits.some(d => d === '')) {
      document.getElementById('setupError').textContent = '! יש להזין קוד סודי של 4 ספרות';
      return;
    }
    secretCode = digits.join('');
    wrongAttempts = 0;
    remainingSeconds = totalSeconds;
    updateDots();
    showScreen('game');
    updateTimerDisplay();
    resumeAudio();
    startTimer();
    startTicking();
    setTimeout(() => document.getElementById('e0').focus(), 300);
  }

  /* ── Timer ── */
  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerDisplay();
      // update tick speed when hitting 10s threshold
      if (remainingSeconds === 10) {
        stopTicking();
        startTicking();
      }
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        stopTicking();
        triggerExplosion('הזמן נגמר — המטען התפוצץ');
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    const el = document.getElementById('timerDisplay');
    el.textContent = pad(m) + ':' + pad(s);
    el.className = 'timer-display';
    if (remainingSeconds <= 10) el.classList.add('critical');
    else if (remainingSeconds <= 60) el.classList.add('warning');
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  /* ── Attempt dots (3 lives) ── */
  function updateDots() {
    for (let i = 0; i < MAX_ATTEMPTS; i++) {
      const dot = document.getElementById('dot' + i);
      dot.classList.toggle('used', i < wrongAttempts);
    }
  }

  /* ── Defuse ── */
  function attemptDefuse() {
    const digits = enterIds.map(id => document.getElementById(id).value);
    if (digits.some(d => d === '')) {
      document.getElementById('feedback').textContent = '! יש להזין את כל 4 הספרות';
      return;
    }
    const entered = digits.join('');

    if (entered === secretCode) {
      clearInterval(timerInterval);
      stopTicking();
      document.getElementById('led').classList.add('safe');
      document.getElementById('svgLed').setAttribute('fill', '#00ff88');
      document.getElementById('defuseBtn').disabled = true;
      setTimeout(() => {
        document.getElementById('winTime').innerHTML =
          'זמן שנותר: <span>' + pad(Math.floor(remainingSeconds / 60)) + ':' + pad(remainingSeconds % 60) + '</span>';
        showScreen('win');
        spawnParticles('#00ff88', null);
      }, 500);
    } else {
      wrongAttempts++;
      updateDots();
      clearEnterInputs();

      if (wrongAttempts >= MAX_ATTEMPTS) {
        clearInterval(timerInterval);
        stopTicking();
        document.getElementById('defuseBtn').disabled = true;
        document.getElementById('feedback').textContent = '3 טעויות — פיצוץ מיידי!';
        setTimeout(() => triggerExplosion('3 קודים שגויים — המשימה נכשלה'), 600);
      } else {
        const left = MAX_ATTEMPTS - wrongAttempts;
        document.getElementById('feedback').textContent =
          'קוד שגוי — נותרו ' + left + ' ניסיון' + (left === 1 ? '' : 'ות');
        const inp = document.getElementById('enterInputs');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
      }
    }
  }

  function clearEnterInputs() {
    enterIds.forEach(id => document.getElementById(id).value = '');
    setTimeout(() => document.getElementById('e0').focus(), 50);
  }

  /* ── Explosion ── */
  function triggerExplosion(reason) {
    document.getElementById('loseSub').textContent = reason || 'המטען התפוצץ — המשימה נכשלה';

    const flash = document.createElement('div');
    flash.className = 'flash-overlay';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 900);

    const ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ['#ff6600','#ff2200','#ffaa00'].forEach((c, i) => {
      const r = document.createElement('div');
      r.className = 'ring';
      r.style.cssText = 'border-color:' + c + ';animation-delay:' + (i * 0.12) + 's';
      ring.appendChild(r);
    });
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1500);

    spawnParticles('#ff4400', '#ff8800');
    setTimeout(() => showScreen('lose'), 900);
  }

  /* ── Particles ── */
  function spawnParticles(c1, c2) {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    const colors = c2 ? [c1, c2, '#ffcc00'] : [c1, '#aaffcc', '#ffffff'];
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (let i = 0; i < 55; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * 2 * Math.PI;
      const dist = 80 + Math.random() * 260;
      const sz = 4 + Math.random() * 7;
      p.style.cssText =
        'left:' + cx + 'px;top:' + cy + 'px;' +
        'background:' + colors[i % colors.length] + ';' +
        '--dx:' + (Math.cos(angle) * dist) + 'px;' +
        '--dy:' + (Math.sin(angle) * dist) + 'px;' +
        'animation-delay:' + (Math.random() * 0.22) + 's;' +
        'animation-duration:' + (1.1 + Math.random() * 0.8) + 's;' +
        'width:' + sz + 'px;height:' + sz + 'px;';
      container.appendChild(p);
    }
    setTimeout(() => { container.innerHTML = ''; }, 2400);
  }

  /* ── Screen ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.body.scrollTop = 0;
  }

  /* ── Reset ── */
  function resetGame() {
    clearInterval(timerInterval);
    stopTicking();
    secretCode = '';
    totalSeconds = 0;
    remainingSeconds = 0;
    wrongAttempts = 0;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
    setupIds.forEach(id => document.getElementById(id).value = '');
    enterIds.forEach(id => document.getElementById(id).value = '');
    ['feedback','setupError'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('defuseBtn').disabled = false;
    document.getElementById('led').classList.remove('safe');
    document.getElementById('svgLed').setAttribute('fill', '#ff2222');
    updateDots();
    showScreen('setup');
  }
</script>
