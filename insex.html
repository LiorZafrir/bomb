<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>נטרול מטען חבלה</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #ff2222;
    --green: #00ff88;
    --amber: #ffcc00;
    --bg: #0a0a0a;
    --panel: #111118;
    --panel2: #1a1a2e;
    --text: #e0e0e0;
    --dim: #666;
  }

  html {
    height: 100%;
    /* prevent iOS bounce scroll causing layout issues */
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    /* full height with dvh for iOS Safari address bar */
    height: 100%;
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    /* safe area for notched iPhones */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  /* scanline overlay — use explicit sides for Safari */
  body::after {
    content: '';
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 560px;
    padding: 20px 16px 32px;
    /* min-height fallback for iOS */
    min-height: 100vh;
    min-height: 100dvh;
    animation: fadeIn 0.35s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

  /* ── HEADINGS ── */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem, 5.5vw, 2.2rem);
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.18em;
    text-align: center;
    margin-bottom: 24px;
  }

  /* ── SETUP SCREEN ── */
  #setup {
    justify-content: center;
  }
  #setup h1 { color: var(--amber); text-shadow: 0 0 18px rgba(255,204,0,0.5); }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
    width: 100%;
    text-align: center;
  }

  .time-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    /* row-reverse for RTL logical order */
    flex-direction: row-reverse;
    align-items: center;
    width: 100%;
  }
  .time-btn {
    flex: 1;
    padding: 12px 4px;
    background: var(--panel);
    border: 2px solid #333;
    color: var(--dim);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    cursor: pointer;
    border-radius: 6px;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    /* min 44px touch target */
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  .time-btn:active { opacity: 0.75; }
  .time-btn.selected {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(255,204,0,0.08);
    box-shadow: 0 0 14px rgba(255,204,0,0.25);
  }
  .time-btn span {
    display: block;
    font-size: 0.5rem;
    letter-spacing: 0.12em;
    color: inherit;
    margin-top: 3px;
    font-family: 'Share Tech Mono', monospace;
  }

  /* TEST button — smaller */
  .test-btn {
    flex: 0 0 auto;
    padding: 8px 10px;
    font-size: clamp(0.6rem, 2.5vw, 0.7rem);
    min-height: 44px;
    border-color: #2a2a2a;
    color: #555;
  }
  .test-btn span { font-size: 0.45rem; }
  .test-btn.selected {
    border-color: var(--red);
    color: var(--red);
    background: rgba(255,34,34,0.08);
    box-shadow: 0 0 14px rgba(255,34,34,0.25);
  }

  /* Code inputs — responsive */
  .code-inputs {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    flex-direction: row-reverse;
    width: 100%;
    justify-content: center;
  }
  .code-inputs input {
    /* fill available width, max 58px */
    flex: 1;
    max-width: 58px;
    min-width: 0;
    height: 66px;
    background: var(--panel2);
    border: 2px solid #333;
    border-radius: 6px;
    color: var(--amber);
    font-family: 'Orbitron', sans-serif;
    /* 16px min to prevent iOS auto-zoom */
    font-size: clamp(16px, 5vw, 2rem);
    text-align: center;
    outline: none;
    caret-color: var(--amber);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 6px;
  }
  .code-inputs input:focus {
    border-color: var(--amber);
    box-shadow: 0 0 10px rgba(255,204,0,0.3);
  }

  .arm-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #7a0000, #cc0000);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.85rem, 3.5vw, 1.05rem);
    letter-spacing: 0.16em;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.2s;
    box-shadow: 0 0 22px rgba(200,0,0,0.4);
    touch-action: manipulation;
    min-height: 54px;
    -webkit-appearance: none;
    appearance: none;
  }
  .arm-btn:active { opacity: 0.8; }

  .error-msg {
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--red);
    letter-spacing: 0.08em;
    min-height: 18px;
    text-align: center;
  }

  /* ── GAME SCREEN ── */
  #game {
    justify-content: flex-start;
    padding-top: 16px;
  }
  #game h1 { color: var(--red); text-shadow: 0 0 20px rgba(255,34,34,0.6); }

  .bomb-wrapper {
    position: relative;
    /* responsive: fill width up to 300px */
    width: min(300px, 88vw);
    aspect-ratio: 320 / 220;
    margin: 0 auto 16px;
  }

  .bomb-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(255,34,34,0.35));
  }

  .timer-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .timer-display {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 9vw, 3.2rem);
    font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 18px rgba(255,34,34,0.9), 0 0 4px #fff;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .timer-display.warning { color: var(--amber); text-shadow: 0 0 18px rgba(255,204,0,0.9); }
  .timer-display.critical {
    color: var(--red);
    animation: blink 0.5s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0.15; } }

  .led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 7px 2px rgba(255,34,34,0.8);
    animation: ledBlink 1s step-start infinite;
    margin-top: 5px;
  }
  @keyframes ledBlink { 50% { opacity: 0.1; box-shadow: none; } }
  .led.safe { background: var(--green); box-shadow: 0 0 7px 2px rgba(0,255,136,0.8); animation: none; }

  /* defusal panel */
  .defusal-panel {
    background: var(--panel);
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 18px 14px;
    width: 100%;
  }
  .panel-label {
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-align: center;
    margin-bottom: 12px;
  }

  .enter-inputs {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 14px;
    flex-direction: row-reverse;
    width: 100%;
  }
  .enter-inputs input {
    flex: 1;
    max-width: 54px;
    min-width: 0;
    height: 60px;
    background: #0d0d1a;
    border: 2px solid #2a2a4a;
    border-radius: 6px;
    color: var(--green);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px, 5vw, 1.8rem);
    text-align: center;
    outline: none;
    caret-color: var(--green);
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .enter-inputs input:focus {
    border-color: var(--green);
    box-shadow: 0 0 10px rgba(0,255,136,0.3);
  }

  .defuse-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--green);
    border-radius: 6px;
    color: var(--green);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.75rem, 3vw, 0.95rem);
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  .defuse-btn:active { background: rgba(0,255,136,0.12); }

  .feedback {
    min-height: 20px;
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    margin-top: 10px;
    color: var(--red);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .shake { animation: shake 0.38s ease; }

  .attempts {
    font-size: 0.65rem;
    color: #444;
    letter-spacing: 0.12em;
    margin-top: 6px;
    text-align: center;
  }

  /* ── WIN SCREEN ── */
  #win {
    justify-content: center;
    background: radial-gradient(ellipse at center, #001a0e 0%, var(--bg) 70%);
  }
  #win h1 { color: var(--green); text-shadow: 0 0 28px rgba(0,255,136,0.7); font-size: clamp(1.4rem, 5vw, 2.2rem); }

  .win-icon { margin: 20px 0; }
  .win-time {
    font-size: 0.85rem;
    color: var(--dim);
    letter-spacing: 0.14em;
    margin-bottom: 28px;
    text-align: center;
  }
  .win-time span { color: var(--green); }

  /* ── LOSE SCREEN ── */
  #lose {
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a0000 0%, var(--bg) 70%);
  }
  #lose h1 { color: var(--red); text-shadow: 0 0 38px rgba(255,0,0,0.9); font-size: clamp(1.6rem, 6vw, 2.6rem); }

  .lose-sub {
    color: var(--dim);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    margin: 10px 0 28px;
    text-align: center;
  }

  /* shared result button */
  .result-btn {
    padding: 14px 36px;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.75rem, 3vw, 0.85rem);
    letter-spacing: 0.18em;
    cursor: pointer;
    border: 2px solid;
    transition: background 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    min-height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  #win .result-btn { border-color: var(--green); color: var(--green); background: transparent; }
  #win .result-btn:active { background: rgba(0,255,136,0.12); }
  #lose .result-btn { border-color: var(--red); color: var(--red); background: transparent; }
  #lose .result-btn:active { background: rgba(255,34,34,0.1); }

  /* ── PARTICLES & EFFECTS ── */
  .particles {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 100;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particleFly 1.8s ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  .flash-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: #ff4400;
    animation: flashFade 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 200;
  }
  @keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0; } }

  .explosion-ring {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 4px solid;
    animation: expandRing 1.2s ease-out forwards;
  }
  @keyframes expandRing {
    0% { width: 20px; height: 20px; opacity: 1; }
    100% { width: 600px; height: 600px; opacity: 0; }
  }
</style>
</head>
<body>

<!-- ═══════════════ SETUP SCREEN ═══════════════ -->
<div id="setup" class="screen active">
  <h1>יחידת נטרול מטענים</h1>
  <p class="subtitle">הכן את המשימה לפני ההפעלה</p>

  <p class="section-label">▸ בחר זמן לנטרול</p>
  <div class="time-btns">
    <button class="time-btn" data-min="120" onclick="selectTime(this)">
      120 <span>דקות</span>
    </button>
    <button class="time-btn" data-min="90" onclick="selectTime(this)">
      90 <span>דקות</span>
    </button>
    <button class="time-btn" data-min="60" onclick="selectTime(this)">
      60 <span>דקות</span>
    </button>
    <button class="time-btn test-btn" data-seconds="10" onclick="selectTime(this)">
      TEST <span>10 שניות</span>
    </button>
  </div>

  <p class="section-label">▸ הגדר קוד נטרול סודי (5 ספרות)</p>
  <div class="code-inputs" id="secretInputs">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 5" id="s4" oninput="moveSetupFocus(this,4)" onkeydown="setupBack(event,this,4)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 4" id="s3" oninput="moveSetupFocus(this,3)" onkeydown="setupBack(event,this,3)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 3" id="s2" oninput="moveSetupFocus(this,2)" onkeydown="setupBack(event,this,2)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 2" id="s1" oninput="moveSetupFocus(this,1)" onkeydown="setupBack(event,this,1)">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 1" id="s0" oninput="moveSetupFocus(this,0)" onkeydown="setupBack(event,this,0)">
  </div>

  <button class="arm-btn" onclick="armDevice()">הפעל מטען</button>
  <p class="error-msg" id="setupError"></p>
</div>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div id="game" class="screen">
  <h1>מטען פעיל</h1>
  <p class="subtitle">נטרל לפני שהזמן יגמר</p>

  <div class="bomb-wrapper">
    <svg class="bomb-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <rect x="30" y="60" width="260" height="130" rx="18" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      <!-- metal ridges -->
      <rect x="30" y="78" width="260" height="6" fill="#222" rx="2"/>
      <rect x="30" y="166" width="260" height="6" fill="#222" rx="2"/>
      <!-- bolts -->
      <circle cx="48" cy="76" r="5" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
      <circle cx="272" cy="76" r="5" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
      <circle cx="48" cy="174" r="5" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
      <circle cx="272" cy="174" r="5" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
      <!-- LCD screen -->
      <rect x="80" y="88" width="160" height="74" rx="6" fill="#050508" stroke="#1a1a2e" stroke-width="2"/>
      <rect x="84" y="92" width="152" height="66" rx="4" fill="#020205"/>
      <!-- LCD scan lines -->
      <line x1="84" y1="100" x2="236" y2="100" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="108" x2="236" y2="108" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="116" x2="236" y2="116" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="124" x2="236" y2="124" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="132" x2="236" y2="132" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="140" x2="236" y2="140" stroke="#0a0a1a" stroke-width="1.5"/>
      <line x1="84" y1="148" x2="236" y2="148" stroke="#0a0a1a" stroke-width="1.5"/>
      <!-- wires left -->
      <path d="M30,100 Q15,100 10,90 Q5,80 15,75" stroke="#cc3300" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30,120 Q8,120 8,108 Q8,96 18,95" stroke="#ffcc00" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30,140 Q12,140 10,150 Q8,162 20,165" stroke="#00aa55" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30,158 Q16,158 12,170 Q8,182 22,185" stroke="#2255cc" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- wires right -->
      <path d="M290,100 Q308,100 312,88 Q316,76 306,72" stroke="#cc3300" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M290,120 Q310,120 312,108" stroke="#ffcc00" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M290,140 Q308,140 312,152 Q316,164 304,168" stroke="#00aa55" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M290,158 Q308,158 312,172" stroke="#2255cc" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- side panels -->
      <rect x="46" y="102" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <rect x="46" y="124" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <rect x="46" y="146" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <rect x="252" y="102" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <rect x="252" y="124" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <rect x="252" y="146" width="22" height="16" rx="2" fill="#111" stroke="#2a2a2a"/>
      <!-- toggle switches -->
      <rect x="50" y="106" width="14" height="6" rx="3" fill="#330000"/>
      <rect x="50" y="128" width="14" height="6" rx="3" fill="#003300"/>
      <rect x="50" y="150" width="14" height="6" rx="3" fill="#333300"/>
      <circle cx="56" cy="109" r="3" fill="#cc0000"/>
      <circle cx="62" cy="131" r="3" fill="#00cc44"/>
      <circle cx="56" cy="153" r="3" fill="#ccaa00"/>
      <!-- LED -->
      <circle id="svgLed" cx="160" cy="73" r="5" fill="#ff2222">
        <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- handle -->
      <rect x="120" y="45" width="80" height="18" rx="8" fill="#1e1e1e" stroke="#333" stroke-width="1.5"/>
      <rect x="130" y="49" width="60" height="10" rx="5" fill="#161616"/>
      <!-- serial -->
      <text x="160" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#2a2a2a">SN-74XB-2049 // CLASS-A EXPLOSIVE</text>
    </svg>

    <div class="timer-overlay">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="led" id="led"></div>
    </div>
  </div>

  <div class="defusal-panel">
    <p class="panel-label">▸ הזן את קוד הנטרול</p>
    <div class="enter-inputs" id="enterInputs">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 5" id="e4" oninput="moveEnterFocus(this,4)" onkeydown="enterBack(event,this,4)">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 4" id="e3" oninput="moveEnterFocus(this,3)" onkeydown="enterBack(event,this,3)">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 3" id="e2" oninput="moveEnterFocus(this,2)" onkeydown="enterBack(event,this,2)">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 2" id="e1" oninput="moveEnterFocus(this,1)" onkeydown="enterBack(event,this,1)">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="ספרה 1" id="e0" oninput="moveEnterFocus(this,0)" onkeydown="enterBack(event,this,0)">
    </div>
    <button class="defuse-btn" onclick="attemptDefuse()">נטרל מטען</button>
    <p class="feedback" id="feedback"></p>
    <p class="attempts" id="attempts"></p>
  </div>
</div>

<!-- ═══════════════ WIN SCREEN ═══════════════ -->
<div id="win" class="screen">
  <h1>המטען נוטרל!</h1>
  <div class="win-icon">
    <svg width="90" height="90" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#00ff88" stroke-width="3"/>
      <polyline points="28,52 44,68 72,36" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="win-time" id="winTime">זמן שנותר: <span>--:--</span></p>
  <button class="result-btn" onclick="resetGame()">משימה חדשה</button>
</div>

<!-- ═══════════════ LOSE SCREEN ═══════════════ -->
<div id="lose" class="screen">
  <h1>פיצוץ!</h1>
  <p class="lose-sub">המטען התפוצץ — המשימה נכשלה</p>
  <svg width="100" height="100" viewBox="0 0 110 110" style="margin-bottom:24px">
    <circle cx="55" cy="55" r="30" fill="#3a0000"/>
    <circle cx="55" cy="55" r="20" fill="#660000"/>
    <circle cx="55" cy="55" r="10" fill="#cc2200"/>
    <line x1="55" y1="55" x2="55" y2="8"  stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="55" y2="102" stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="8"  y2="55" stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="102" y2="55" stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="22" y2="22" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="22" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="22" y2="88" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="88" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <button class="result-btn" onclick="resetGame()">נסה שוב</button>
</div>

<div class="particles" id="particles"></div>

<script>
  let secretCode = '';
  let totalSeconds = 0;
  let remainingSeconds = 0;
  let timerInterval = null;
  let attempts = 0;
  const setupIds = ['s0','s1','s2','s3','s4'];
  const enterIds = ['e0','e1','e2','e3','e4'];

  /* ── setup input helpers ── */
  function moveSetupFocus(el, idx) {
    // keep only last digit entered (handles iOS paste/replace)
    const v = el.value.replace(/[^0-9]/g, '');
    el.value = v.slice(-1);
    if (el.value && idx < 4) document.getElementById(setupIds[idx + 1]).focus();
  }
  function setupBack(e, el, idx) {
    if (e.key === 'Backspace' && !el.value && idx > 0) {
      e.preventDefault();
      document.getElementById(setupIds[idx - 1]).focus();
    }
  }

  /* ── enter input helpers ── */
  function moveEnterFocus(el, idx) {
    const v = el.value.replace(/[^0-9]/g, '');
    el.value = v.slice(-1);
    if (el.value && idx < 4) document.getElementById(enterIds[idx + 1]).focus();
  }
  function enterBack(e, el, idx) {
    if (e.key === 'Backspace' && !el.value && idx > 0) {
      e.preventDefault();
      document.getElementById(enterIds[idx - 1]).focus();
    }
  }

  /* ── time selector ── */
  function selectTime(btn) {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (btn.dataset.seconds) {
      totalSeconds = parseInt(btn.dataset.seconds, 10);
    } else {
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
    }
  }

  /* ── arm ── */
  function armDevice() {
    document.getElementById('setupError').textContent = '';
    if (!totalSeconds) {
      document.getElementById('setupError').textContent = '! יש לבחור זמן נטרול';
      return;
    }
    const digits = setupIds.map(id => document.getElementById(id).value);
    if (digits.some(d => d === '')) {
      document.getElementById('setupError').textContent = '! יש להזין קוד סודי של 5 ספרות';
      return;
    }
    secretCode = digits.join('');
    attempts = 0;
    remainingSeconds = totalSeconds;
    showScreen('game');
    updateTimerDisplay();
    startTimer();
    // slight delay before focus to let keyboard settle on iOS
    setTimeout(() => document.getElementById('e0').focus(), 300);
  }

  /* ── timer ── */
  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerDisplay();
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        triggerExplosion();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    const display = document.getElementById('timerDisplay');
    display.textContent = pad(m) + ':' + pad(s);
    display.className = 'timer-display';
    if (remainingSeconds <= 10) display.classList.add('critical');
    else if (remainingSeconds <= 60) display.classList.add('warning');
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  /* ── defuse attempt ── */
  function attemptDefuse() {
    const digits = enterIds.map(id => document.getElementById(id).value);
    if (digits.some(d => d === '')) {
      showFeedback('! יש להזין את כל 5 הספרות');
      return;
    }
    const entered = digits.join('');
    attempts++;
    if (entered === secretCode) {
      clearInterval(timerInterval);
      document.getElementById('led').classList.add('safe');
      document.getElementById('svgLed').setAttribute('fill', '#00ff88');
      setTimeout(() => {
        document.getElementById('winTime').innerHTML =
          'זמן שנותר: <span>' + pad(Math.floor(remainingSeconds/60)) + ':' + pad(remainingSeconds%60) + '</span>';
        showScreen('win');
        spawnParticles('#00ff88', null);
      }, 500);
    } else {
      showFeedback('קוד שגוי — נסה שוב');
      const inp = document.getElementById('enterInputs');
      inp.classList.add('shake');
      setTimeout(() => inp.classList.remove('shake'), 400);
      clearEnterInputs();
      document.getElementById('attempts').textContent = 'ניסיון ' + attempts;
    }
  }

  function showFeedback(msg) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
  }

  function clearEnterInputs() {
    enterIds.forEach(id => document.getElementById(id).value = '');
    setTimeout(() => document.getElementById('e0').focus(), 50);
  }

  /* ── explosion ── */
  function triggerExplosion() {
    const flash = document.createElement('div');
    flash.className = 'flash-overlay';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 900);

    const ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ['#ff6600', '#ff2200'].forEach((color, i) => {
      const r = document.createElement('div');
      r.className = 'ring';
      r.style.cssText = 'border-color:' + color + ';animation-delay:' + (i * 0.15) + 's';
      ring.appendChild(r);
    });
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1400);

    spawnParticles('#ff4400', '#ff8800');
    setTimeout(() => showScreen('lose'), 900);
  }

  /* ── particles ── */
  function spawnParticles(color1, color2) {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    const colors = color2 ? [color1, color2, '#ffcc00'] : [color1, '#aaffcc', '#ffffff'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 55; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * 2 * Math.PI;
      const dist = 100 + Math.random() * 260;
      p.style.cssText =
        'left:' + cx + 'px;top:' + cy + 'px;' +
        'background:' + colors[i % colors.length] + ';' +
        '--dx:' + (Math.cos(angle) * dist) + 'px;' +
        '--dy:' + (Math.sin(angle) * dist) + 'px;' +
        'animation-delay:' + (Math.random() * 0.25) + 's;' +
        'animation-duration:' + (1.1 + Math.random() * 0.8) + 's;' +
        'width:' + (4 + Math.random() * 7) + 'px;' +
        'height:' + (4 + Math.random() * 7) + 'px;';
      container.appendChild(p);
    }
    setTimeout(() => { container.innerHTML = ''; }, 2500);
  }

  /* ── screen transitions ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    // scroll to top on iOS
    document.body.scrollTop = 0;
  }

  /* ── reset ── */
  function resetGame() {
    clearInterval(timerInterval);
    secretCode = '';
    totalSeconds = 0;
    remainingSeconds = 0;
    attempts = 0;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
    setupIds.forEach(id => document.getElementById(id).value = '');
    clearEnterInputs();
    ['feedback','attempts','setupError'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('led').classList.remove('safe');
    document.getElementById('svgLed').setAttribute('fill', '#ff2222');
    showScreen('setup');
  }
</script>
</body>
</html>
